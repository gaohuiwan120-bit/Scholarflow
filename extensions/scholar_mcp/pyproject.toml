[project]
name = "scholar-mcp"
version = "0.1.0"
description = "ScholarFlow MCP server for academic and repository research"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.12.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
rag = [
    "fastembed>=0.4.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[project.scripts]
scholar-mcp = "scholar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scholar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
