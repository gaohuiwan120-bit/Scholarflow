[project]
name = "scholarflow-api"
version = "0.1.0"
description = "ScholarFlow Phase-1 lightweight FastAPI entry (independent of ScholarFlow Next.js UI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0"]
# Chat LLM (Phase 8) — normally provided by backend/.venv (langchain-deepseek).
llm = ["langchain-deepseek>=0.1.0", "langchain-core>=0.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_llm: real DeepSeek network call (set SCHOLARFLOW_LIVE_LLM=1)",
]
