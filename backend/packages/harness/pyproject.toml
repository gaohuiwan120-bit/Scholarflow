[project]
name = "scholarflow-harness"
version = "0.1.0"
description = "ScholarFlow research harness (evidence models, RAG, artifacts, sandbox)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# ScholarFlow hybrid RAG (ONNX embeddings via fastembed)
scholar-rag = [
    "fastembed>=0.4.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]
scholar-rag-ce = [
    "scholarflow-harness[scholar-rag]",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scholarflow"]
